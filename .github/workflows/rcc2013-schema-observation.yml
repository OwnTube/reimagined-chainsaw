name: Observe exact 2013 reference schema
on:
  workflow_dispatch:
  push:
    branches: [rcc2013-ci]
    paths:
      - 'hosting2013/schema_observer.py'
      - 'hosting2013/test_schema_observer.py'
      - 'hosting2013/globals_observer.py'
      - 'hosting2013/host.lua'
      - 'hosting2013/client.lua'
      - 'hosting2013/test_globals_observer.py'
      - 'hosting2013/verify_descriptor_writer.py'
      - 'hosting2013/correlate_service_guids.py'
      - 'server2013/protocol/*.hpp'
      - 'server2013/protocol/*.cpp'
      - 'hosting2013/descriptor_codec.py'
      - 'hosting2013/verify_schema_observation.py'
      - 'hosting2013/test_descriptor_codec.py'
      - 'hosting2013/raknet_reference/**'
      - '.github/workflows/rcc2013-schema-observation.yml'
permissions:
  contents: read
concurrency:
  group: rcc2013-schema-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow cryptography
      - name: Test bounded observations and sensitive-message exclusion
        working-directory: hosting2013
        run: python -m unittest -v test_schema_observer.py test_descriptor_codec.py test_globals_observer.py test_bootstrap.py test_local_player.py
      - name: Compile our portable descriptor encoder with MSVC
        shell: pwsh
        run: |
          $install = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'C++ compiler not found' }
          New-Item -ItemType Directory server2013/build -Force | Out-Null
          $build = (Resolve-Path server2013/build).Path
          @"
          @echo off
          call "$install\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /O2 /EHsc /MT server2013\protocol\descriptor_writer_probe.cpp /Fo:"$build\descriptor_writer_probe.obj" /Fe:"$build\descriptor_writer_probe.exe"
          exit /b %errorlevel%
          "@ | Set-Content server2013/build/build-codec.cmd -Encoding ascii
          cmd /c "$build\build-codec.cmd"
          if ($LASTEXITCODE -ne 0) { throw 'Owned descriptor encoder compilation failed' }
      - name: Restore pinned reference programs only on disposable runner
        working-directory: rcc2013
        run: python download.py
      - name: Release disposable runner default IIS
        shell: pwsh
        run: |
          $service = Get-Service W3SVC -ErrorAction SilentlyContinue
          if ($service -and $service.Status -eq 'Running') {
            'RCC2013_RESTART_IIS=1' >> $env:GITHUB_ENV
            Stop-Service W3SVC -Force -ErrorAction Stop
          }
      - name: Observe application symbol layout on owned reference connection
        env:
          RCC2013_CODEC_PROBE_PATH: ${{ github.workspace }}\server2013\build\descriptor_writer_probe.exe
        run: python hosting2013/windows_join_probe.py --studio rcc2013/vendor/studio/RobloxStudioBeta.exe --player rcc2013/vendor/player/RobloxPlayerBeta.exe --player-profile local-signed --host-profile local-player --trace-transport --output hosting2013/player-output --timeout 40
      - name: Require a complete decoded schema matching reviewed native fields
        run: python hosting2013/verify_schema_observation.py hosting2013/player-output/transport-trace.json
      - name: Compare generated C++ dictionary bits to actual reference wire hash
        run: python hosting2013/verify_descriptor_writer.py --encoder server2013/build/descriptor_writer_probe.exe --trace hosting2013/player-output/transport-trace.json --output hosting2013/player-output/descriptor-writer-result.json
      - name: Match globals indices to independent service API observations
        run: python hosting2013/correlate_service_guids.py --trace hosting2013/player-output/transport-trace.json --result hosting2013/player-output/result.json --output hosting2013/player-output/globals-service-result.json
      - name: Preserve bounded observations and owned fixture diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rcc2013-schema-observations
          path: hosting2013/player-output/
          retention-days: 7
      - name: Restore disposable runner IIS
        if: always() && env.RCC2013_RESTART_IIS == '1'
        shell: pwsh
        run: Start-Service W3SVC
