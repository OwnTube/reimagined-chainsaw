name: Native 2013 rendering research
on:
  push:
    branches: [rcc2013-ci]
    paths: ["rcc2013/**", ".github/workflows/rcc2013.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
        working-directory: rcc2013
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install capture dependency
        run: python -m pip install Pillow
      - name: Check camera validation and HTTP control plane
        run: python -m unittest -v test_server.py
      - name: Restore both complete 2013 deployments
        run: python download.py
      - name: Render two scenes through the local API and native Studio
        run: python windows_e2e.py --studio vendor/studio/RobloxStudioBeta.exe
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rcc2013-native-evidence
          path: rcc2013/output/
          retention-days: 7
