name: Native 2013 local joining research
on:
  push:
    branches: [rcc2013-ci]
    paths: ["hosting2013/**", ".github/workflows/rcc2013-join.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  join:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install capture dependency
        run: python -m pip install Pillow
      - name: Restore pinned 2013 Studio and Player
        working-directory: rcc2013
        run: python download.py
      - name: Test native server admission and replicated local movement
        run: python hosting2013/windows_join_probe.py --studio rcc2013/vendor/studio/RobloxStudioBeta.exe
      - name: Preserve owned join evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rcc2013-local-join-evidence
          path: hosting2013/output/
          retention-days: 7
