name: Native 2013 local joining research
on:
  push:
    branches: [rcc2013-ci]
    paths: ["hosting2013/**", ".github/workflows/rcc2013-join.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  join:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install capture dependency
        run: python -m pip install Pillow cryptography
      - name: Check independent replication challenge generation
        working-directory: hosting2013
        run: python -m unittest -v test_bootstrap.py test_local_player.py
      - name: Restore pinned 2013 Studio and Player
        id: restore
        working-directory: rcc2013
        run: python download.py
      - name: Test Studio hosting with the standalone Player and signed local bootstrap
        run: python hosting2013/windows_join_probe.py --studio rcc2013/vendor/studio/RobloxStudioBeta.exe --player rcc2013/vendor/player/RobloxPlayerBeta.exe --player-profile local-signed --output hosting2013/player-output --timeout 60
      - name: Preserve owned join evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rcc2013-local-join-evidence
          path: |
            hosting2013/output/
            hosting2013/player-output/
          retention-days: 7
