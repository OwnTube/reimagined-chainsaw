name: Native 2013 local joining research
on:
  push:
    branches: [rcc2013-ci]
    paths: ["hosting2013/**", ".github/workflows/rcc2013-join.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  join:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install capture dependency
        run: python -m pip install Pillow cryptography imageio-ffmpeg==0.6.0
      - name: Check independent replication challenge generation
        working-directory: hosting2013
        run: python -m unittest -v test_bootstrap.py test_local_player.py
      - name: Restore pinned 2013 Studio and Player
        id: restore
        working-directory: rcc2013
        run: python download.py
      - name: Release the disposable runner's default IIS listener
        shell: pwsh
        run: |
          Get-NetTCPConnection -LocalPort 80 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalAddress,LocalPort,OwningProcess
          $service = Get-Service W3SVC -ErrorAction SilentlyContinue
          if ($service -and $service.Status -eq 'Running') {
            'RCC2013_RESTART_IIS=1' >> $env:GITHUB_ENV
            Stop-Service W3SVC -Force -ErrorAction Stop
          }
      - name: Test Studio hosting with the standalone Player and signed local bootstrap
        run: python hosting2013/windows_join_probe.py --studio rcc2013/vendor/studio/RobloxStudioBeta.exe --player rcc2013/vendor/player/RobloxPlayerBeta.exe --player-profile local-signed --host-profile local-player --test-input --input-method scancode --record --output hosting2013/player-output --timeout 60
      - name: Preserve owned join evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rcc2013-local-join-evidence
          path: |
            hosting2013/output/
            hosting2013/player-output/
          retention-days: 7
      - name: Restore the runner IIS service if it was running
        if: always() && env.RCC2013_RESTART_IIS == '1'
        shell: pwsh
        run: Start-Service W3SVC
