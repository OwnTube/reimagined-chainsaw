name: Verify MewTube
on:
  push:
    branches: [feat/mewtube]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the self-hosting stack
        run: docker compose up -d --build
      - name: Verify container health
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(60):
              try:
                  response = json.load(urllib.request.urlopen('http://localhost:3000/healthz',timeout=3))
                  assert response['ok'] and response['ffmpeg']
                  print('Container HTTP and FFmpeg health verified')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Container never became healthy')
          PY
      - name: Stop disposable stack
        if: always()
        run: docker compose logs --no-color && docker compose down -v
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: HTTP integration tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js && node --check web/bridge.js && node tests/bridge.test.mjs && node tests/playback_probe.test.mjs
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
      - name: Capture a guest client
        continue-on-error: true
        timeout-minutes: 4
        run: python scripts/fetch_client.py
      - name: Browser and playback evidence
        timeout-minutes: 5
        run: |
          mkdir -p evidence
          ffmpeg -v error -y -f lavfi -i testsrc2=size=640x360:rate=24 -f lavfi -i sine=frequency=440 -t 8 -c:v libx264 -pix_fmt yuv420p -c:a aac evidence/sample.mp4
          python -m mewtube.server > evidence/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && break; sleep 1; done
          npm run test:browser
      - name: Upload browser diagnostics before static analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mewtube-browser-evidence
          path: |
            evidence/*.png
            evidence/browser.json
            evidence/server.log
          retention-days: 3
      - name: REA static analysis
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p evidence
          npx --yes --package=rea-agents@6.7.0 rea analyze-javascript-application "$PWD/data/client/assets" --json > evidence/rea.json
      - name: Upload diagnostics (no downloaded client or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mewtube-rea-evidence
          path: evidence/rea.json
          retention-days: 3
